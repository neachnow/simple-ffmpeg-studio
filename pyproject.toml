[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ffmpeg-studio"
version = "1.0.1"
description = "A desktop FFmpeg workspace built with PySide6."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials>=6.7,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pyinstaller>=6.0,<7",
]

[project.scripts]
ffmpeg-studio = "ffmpeg_studio.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ffmpeg_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
